[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptstrike"
version = "0.1.0"
description = "An LLM / GenAI red-teaming toolkit for authorized testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "husenet" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "ai-security", "pentest", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # core is stdlib-only

[project.optional-dependencies]
# Optional: lets the Anthropic target use the official SDK instead of raw HTTP.
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/husenet/promptstrike"
Source = "https://github.com/husenet/promptstrike"

[project.scripts]
promptstrike = "promptstrike.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptstrike*"]
